name: Build Android APK (FairShare Cozy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap add android
          npx cap copy android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to FairShare-Cozy.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FairShare-Cozy.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FairShare-Cozy-APK
          path: FairShare-Cozy.apk

      - name: Publish APK to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "FairShare Cozy Android App (.APK)"
          body: "ดาวน์โหลดไฟล์ **FairShare-Cozy.apk** เพื่อติดตั้งลงมือถือ Android ได้ทันที (รองรับทั้งฐานข้อมูลในเครื่อง Offline 100% + ซิงค์กับ Google Sheets ผ่าน Apps Script)"
          files: FairShare-Cozy.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
